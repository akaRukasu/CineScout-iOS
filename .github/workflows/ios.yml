name: Build iOS IPA
on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
      visual_check:
        description: Capture iOS 26 simulator screenshots
        type: boolean
        default: false
  push:
    branches: [main]
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check Seerr request flow and release dates
        run: |
          swiftc CineScout/Seerr.swift CineScout/ReleaseDate.swift Checks/SeerrChecks.swift -o "$RUNNER_TEMP/cinescout-seerr-checks"
          "$RUNNER_TEMP/cinescout-seerr-checks"
      - name: Check Jellyfin ownership and Prowlarr lookups
        run: |
          swiftc CineScout/MediaIdentity.swift CineScout/ReleaseDate.swift CineScout/Prowlarr.swift Checks/CatalogChecks.swift -o "$RUNNER_TEMP/cinescout-catalog-checks"
          "$RUNNER_TEMP/cinescout-catalog-checks"
      - name: Check catalog search and recommendations
        run: |
          swiftc CineScout/MediaIdentity.swift CineScout/ReleaseDate.swift CineScout/TMDbCatalog.swift CineScout/EditorialPicks.swift Checks/DiscoveryChecks.swift -o "$RUNNER_TEMP/cinescout-discovery-checks"
          "$RUNNER_TEMP/cinescout-discovery-checks"
      - name: Check full Jellyfin inventory and roulette
        run: |
          swiftc CineScout/MediaIdentity.swift CineScout/ReleaseDate.swift CineScout/TMDbCatalog.swift CineScout/JellyfinInventory.swift CineScout/Roulette.swift Checks/InventoryRouletteChecks.swift -o "$RUNNER_TEMP/cinescout-roulette-checks"
          "$RUNNER_TEMP/cinescout-roulette-checks"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for device (unsigned)
        run: |
          xcodebuild -project CineScout.xcodeproj -scheme CineScout -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CineScout.app Payload/
          zip -qr CineScout-unsigned.ipa Payload
      - name: Verify IPA
        run: |
          set -euo pipefail
          unzip -tq CineScout-unsigned.ipa
          app=Payload/CineScout.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.akarukasu.cinescout
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneOS
          sdk="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$app/Info.plist")"
          [[ "$sdk" == iphoneos26.* ]]
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist"
          xcrun lipo "$app/CineScout" -verify_arch arm64
          shasum -a 256 CineScout-unsigned.ipa | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: CineScout-unsigned-IPA
          path: CineScout-unsigned.ipa
          if-no-files-found: error
      - name: Capture Liquid Glass on iOS 26
        if: github.event_name == 'workflow_dispatch' && inputs.visual_check
        run: bash Checks/capture-liquid-glass.sh "$RUNNER_TEMP/cinescout-screenshots"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.visual_check
        with:
          name: CineScout-Liquid-Glass-iOS-26
          path: |
            ${{ runner.temp }}/cinescout-screenshots/*.png
            ${{ runner.temp }}/cinescout-screenshots/*.mp4
            ${{ runner.temp }}/cinescout-screenshots/*.log
            ${{ runner.temp }}/cinescout-screenshots/*.ips
          if-no-files-found: error
